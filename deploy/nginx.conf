# new-api 生产 nginx 配置 (B 服务器 47.101.60.138)
# 由本地 make server-setup ENV=prod 上传到服务器 $(APP_BASE)/nginx.conf
#
# 背景: 原链路为用户 -> A 服务器 (139.224.65.205) nginx -> 本机 new-api,
#       流量在 A/B 两台服务器的出方向带宽上被双重计费, 且 A 成为单点。
#       本配置让 nginx 与 new-api 同机部署, 直接终结 www.xiaoyule.com.cn 的 TLS。
# 过渡: 备案/DNS 切换完成前, A 服务器的 www 反代保留作兜底, 本机应用端口保持公网可达
#       (防爆破已改非标端口, 由 PROD_PORT 控制, 默认 3000);
#       切流后在服务器 $(APP_BASE)/deploy.env 设置 API_BIND_ADDR=127.0.0.1 并清理 A 侧 www server 块。

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # AI 网关可能接收图片/文件上传, 对齐 A 侧主站配置
    client_max_body_size 120m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 静态资源压缩 (new-api 管理前端)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # WebSocket 升级头映射 (空值映射为空字符串而非 close, 兼容 upstream keepalive)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # HTTP 重定向到 HTTPS (308 保留 POST 方法)
    server {
        listen 80;
        server_name www.xiaoyule.com.cn;
        return 308 https://$host$request_uri;
    }

    # 同 docker 网络内的 new-api 容器
    upstream new-api-backend {
        server new-api:3000;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        server_name www.xiaoyule.com.cn;

        # 证书由 make server-setup 上传到 $(APP_BASE)/ssl/ (复用主站证书, SAN 含 www)
        ssl_certificate /etc/nginx/ssl/xiaoyule.com.cn.pem;
        ssl_certificate_key /etc/nginx/ssl/xiaoyule.com.cn.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 拦截敏感文件访问探测
        location ~ /\.env {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location / {
            proxy_pass http://new-api-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式响应 (AI 对话) + WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # 上游短暂故障时自动重试 (容器重启/重建时短暂不可用)
            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
