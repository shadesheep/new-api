# new-api 生产环境 Docker Compose 配置 (现役 139.224.65.205, 2026-10-13 自 47.101.60.138 迁入)
# 由本地 make server-setup ENV=prod 上传到服务器 $(APP_BASE)/docker-compose.yml
# 密钥从同目录 .env 读取 (服务器侧 make secrets 生成, 不上传不覆盖)
# 镜像 tag 由 make deploy VERSION=<git-commit> 注入(COMPOSE_ENV), 不带变量手工 up -d 时回落到上次部署 tag
#
# 与旧 138 版模板的差异 (对齐 139 实况, 2026-10-14 回流):
#   - 不自带 nginx/redis/exit-proxy: 入口复用同机 /app/call-it-a-day 项目的 nginx-server,
#     缓存复用其 pool-redis (db2); 本 compose 只管理 postgres + new-api 两个容器
#   - 不暴露 new-api 公网端口, 仅经 nginx-server 入口; postgres 15432 为运维直连保留
services:
  # ⚠️⚠️⚠️ 数据安全红线 —— 操作 postgres 服务前必读 ⚠️⚠️⚠️
  # 1. 本实例承载两个业务库: new-api + call_it_a_day (2026-10-14 起由 MySQL 迁入)
  # 2. 数据落盘在 bind mount /app/new-api/pgdata (容器内 /var/lib/postgresql/data)
  # 3. 严禁: docker compose down -v | docker volume rm (任何 pg 相关卷) | rm -rf pgdata | docker system prune --volumes
  # 4. 重建镜像/升级/迁移等任何破坏性操作前, 必须先手动 pg_dump 全库;
  #    每日 02:30 已有异地备份到 138, 但那是最低保障, 不是操作借口
  postgres:
    image: postgres:15
    container_name: new-api-postgres
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=new-api
      - TZ=Asia/Shanghai
    volumes:
      - /app/new-api/pgdata:/var/lib/postgresql/data
    # 2026-10-14 按用户要求暴露公网运维直连端口(防爆破非标 15432, 密码见服务器 .env POSTGRES_PASSWORD)
    ports:
      - "15432:5432"
    networks:
      - mini-network
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 5

  new-api:
    image: ${IMAGE:-new-api}:${VERSION:-28214a3fd}
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    volumes:
      - /app/new-api/data:/data
      - /app/new-api/logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${POOL_REDIS_PASSWORD}@pool-redis:6379/2
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-prod-139
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mini-network
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mini-network:
    external: true
